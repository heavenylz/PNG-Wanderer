name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PNG-Wanderer --icon assets/app.ico --add-data "assets/app.ico;assets" main.py
      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/PNG-Wanderer.exe" -ArgumentList "--self-test" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged smoke check failed" }
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNG-Wanderer-Windows
          path: dist/PNG-Wanderer.exe
          if-no-files-found: error
      - name: Publish tag as a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $options = @()
          if ($tag -match '(?i)(alpha|beta|rc|pre)') { $options += '--prerelease' }
          gh release create $tag "dist/PNG-Wanderer.exe" --title "PNG Wanderer $tag" --notes-file "RELEASE_NOTES.md" @options
